[project]
name = "pusht-scenarios"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "hidapi>=0.15.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pygame>=2.6.1",
    "pymunk>=7.3.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
pusht-scenarios = "pusht_scenarios:main"
pts-sandbox = "pusht_scenarios.teleop.sandbox:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "imageio>=2.38.1",
    "pytest>=9.1.1",
    "shapely>=2.2.0",
    "stable-worldmodel",
]

[tool.uv.sources]
stable-worldmodel = { git = "https://github.com/galilai-group/stable-worldmodel", rev = "21446f1ede6d5284e981bd7b47f432b994e6d812" }
