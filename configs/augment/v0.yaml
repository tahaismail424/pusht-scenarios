# Augmentation for the v0 suite (configs/suites/v0.yaml).
#   uv run pts-augment -c configs/augment/v0.yaml
#
# Every recording is augmented: with the full-factorial (record_all) suite, any
# env can end up train or test depending on the holdout chosen at export, and
# export simply ignores augmented copies of test-env demos. Per parent: 3 bases
# (original, 1 random SE(2), left-right mirror) x 25 noise copies = 75 demos.
# 486 recordings -> ~36k augmented demos (states only, small). Under the default
# holdout 16 train envs x 6 parents x 75 ~= 7k train episodes (~0.7M frames).
# No palettes: color is one of the suite's factors.

name: v0
sources: [data/raw]
suite: configs/generated/v0/suite.yaml   # only v0's envs (data/raw also holds other sessions)
output_root: data/aug
seed: 0
include_rejected: false
include_failures: true

bases:
  original: true
  se2: {count: 1, rotation_deg: [-180, 180], shift_px: [-60, 60], max_tries: 25}
  mirror_axes_deg: [90]        # T, I and + all have a mirror axis

noise:                         # DINO-WM's levels, fewer copies each (25 per base)
  - [0.0, 3]
  - [0.003, 2]
  - [0.005, 2]
  - [0.01, 3]
  - [0.015, 2]
  - [0.02, 3]
  - [0.025, 2]
  - [0.03, 3]
  - [0.07, 3]
  - [0.15, 2]
