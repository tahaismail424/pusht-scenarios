# Augmentation for the v0 suite (configs/suites/v0.yaml).
#   uv run pts-augment -c configs/augment/v0.yaml
#
# Train-env recordings only (test-env demos are used clean, for adaptation and
# eval). Per parent: 3 bases (original, 1 random SE(2), left-right mirror) x
# 25 noise copies spread over DINO-WM's levels = 75 demos. 160 train recordings
# -> ~12k episodes, ~1.2M frames (LeWM's Push-T set: 18.7k / 2.3M).
# No palettes: color is one of the suite's factors.

name: v0
sources: [data/raw]
output_root: data/aug
seed: 0
suite_splits: [train]
include_rejected: false
include_failures: true

bases:
  original: true
  se2: {count: 1, rotation_deg: [-180, 180], shift_px: [-60, 60], max_tries: 25}
  mirror_axes_deg: [90]        # T, I and + all have a mirror axis

noise:                         # DINO-WM's levels, fewer copies each (25 per base)
  - [0.0, 3]
  - [0.003, 2]
  - [0.005, 2]
  - [0.01, 3]
  - [0.015, 2]
  - [0.02, 3]
  - [0.025, 2]
  - [0.03, 3]
  - [0.07, 3]
  - [0.15, 2]
